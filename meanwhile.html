<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meanwhile</title>
<style>
:root{--ink:#283243;--muted:#7d8490;--bg:#fbf7f1;--paper:#fffdfa;--coral:#e8877f;--rose:#f8e5e0;--line:#ebe3da}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eee6dd,#f8f1e9);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}
.phone{width:390px;height:820px;max-height:96vh;margin:2vh auto;background:var(--bg);border-radius:42px;overflow:hidden;box-shadow:0 30px 90px #0003;position:relative}.status{height:28px;padding:7px 20px 0;font-size:11px;font-weight:700;display:flex;justify-content:space-between}.screen{height:calc(100% - 28px);overflow:auto;padding-bottom:85px}
header{padding:17px 22px 10px;display:flex;justify-content:space-between;align-items:center}.logo{font:28px Georgia,serif}.logo b{color:var(--coral)}.icon{border:0;background:white;width:40px;height:40px;border-radius:50%;box-shadow:0 5px 16px #0001}
.hero{padding:10px 22px 15px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--coral);margin-bottom:8px}h1,h2,h3{font-family:Georgia,serif;margin:0;letter-spacing:-.7px}h1{font-size:31px;line-height:1.08}h2{font-size:25px}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin-top:8px}
.people{display:flex;gap:12px;overflow:auto;padding:7px 22px 18px}.person{min-width:52px;text-align:center;font-size:10px;color:var(--muted)}.avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;border:3px solid white;box-shadow:0 4px 12px #0002;display:block;margin:auto auto 5px}
.recap{margin:0 18px 18px;padding:21px;border-radius:25px;background:linear-gradient(145deg,#384250,#606976);color:#fff}.recap .eyebrow{color:#f4b1aa}.recap p{font-size:13px;line-height:1.5;color:#e1e5e8;margin-top:7px}.recap button,.pill{border:0;border-radius:999px;padding:10px 15px;font-weight:800;margin-top:15px}.recap button{background:#fff;color:var(--ink)}
.section{padding:0 18px 11px;display:flex;justify-content:space-between;align-items:center}.link{border:0;background:none;color:var(--coral);font-size:12px;font-weight:800}
.card{margin:0 18px 14px;background:var(--paper);border:1px solid var(--line);border-radius:23px;overflow:hidden}.photo{width:100%;height:180px;object-fit:cover}.body{padding:14px 15px 16px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:7px}.meta b{color:var(--ink)}.caption{font:18px/1.25 Georgia,serif}.tiny{font-size:11px;color:var(--muted);margin-top:8px}.heart{color:var(--coral)}
.voice{display:flex;gap:10px;align-items:center;background:#f8eeea;padding:10px;border-radius:16px;margin-top:12px}.play{border:0;background:var(--coral);color:white;border-radius:50%;width:40px;height:40px}.wave{flex:1;height:24px;background:repeating-linear-gradient(90deg,#cfa59e 0 2px,transparent 2px 6px)}
.nav{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fffefa;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}.nav button{border:0;background:none;color:#999;font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center}.nav button.active{color:var(--coral);font-weight:900}.nav span{font-size:20px}.fab{position:absolute;right:20px;bottom:84px;width:58px;height:58px;border:0;border-radius:50%;background:var(--coral);color:white;font-size:28px;box-shadow:0 12px 28px #e8877f66;z-index:4}
.timeline{padding:0 18px}.month{font-size:11px;font-weight:900;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;margin:16px 0 10px}.tl{display:flex;gap:10px;margin-bottom:11px}.dot{width:10px;height:10px;border-radius:50%;background:var(--coral);margin-top:8px}.tlbox{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px;flex:1}.tlbox img{width:62px;height:62px;object-fit:cover;border-radius:12px;float:right;margin-left:9px}.tlbox b{font-size:12px}.tlbox p{font:15px/1.25 Georgia,serif;margin-top:4px}
.family{margin:0 18px 9px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:19px;display:flex;gap:12px;align-items:center}.family .avatar{width:44px;height:44px;margin:0}.grow{flex:1}.badge{font-size:9px;font-weight:800;background:var(--rose);color:#a85d57;border-radius:99px;padding:5px 8px}
.capsule{margin:0 18px 14px;padding:20px;border-radius:24px;background:linear-gradient(135deg,#f2dfbd,#fff7e7);border:1px solid #ead7b1}.capsule h3{font-size:20px}.capsule p{font-size:12px;color:#796d5b;line-height:1.45;margin-top:7px}.capsule button{border:0;background:#3e4855;color:#fff;border-radius:99px;padding:10px 14px;font-size:11px;font-weight:800;margin-top:13px}
.sheetbg{position:absolute;inset:0;background:#20273399;display:none;align-items:end;z-index:10}.sheet{background:var(--bg);width:100%;border-radius:29px 29px 0 0;padding:22px}.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.close{border:0;border-radius:50%;width:34px;height:34px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:17px}.choice i{font-style:normal;font-size:24px}.choice b{display:block;margin-top:8px}.choice small{color:var(--muted)}
.toast{position:absolute;left:18px;right:18px;bottom:91px;background:#303947;color:white;padding:13px;border-radius:15px;font-size:12px;display:none;z-index:20}
.welcome{height:100%;padding:28px 23px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 90% 8%,#f6cec7 0 12%,transparent 32%),linear-gradient(145deg,#fffaf4,#f1e4d8)}.wordmark{font:43px Georgia,serif}.wordmark b{color:var(--coral)}.art{height:255px;border-radius:30px;background:linear-gradient(160deg,#d7c8bc,#ead5c8,#f4b4aa);display:grid;place-items:center;font-size:100px}.cta{width:100%;border:0;background:var(--coral);color:white;border-radius:17px;padding:15px;font-weight:900;margin-top:18px}.secondary{width:100%;border:0;background:none;color:var(--muted);padding:12px;font-weight:700}
</style></head><body><div class="phone"><div class="status"><span>9:41</span><span>● ● ●</span></div><div id="app"></div><button class="fab" id="fab" onclick="add()">+</button><div class="nav" id="nav"><button onclick="go('home')"><span>⌂</span>Home</button><button onclick="go('timeline')"><span>◷</span>Timeline</button><button onclick="go('family')"><span>♡</span>Family</button><button onclick="go('capsule')"><span>✦</span>Capsules</button></div><div class="sheetbg" id="sheet" onclick="if(event.target.id==='sheet')closeSheet()"><div class="sheet"><div class="sheettop"><h2>What would you like to share?</h2><button class="close" onclick="closeSheet()">×</button></div><div class="choices"><button class="choice" onclick="toast('Photo added to the family story.')"><i>📷</i><b>Photo</b><small>A moment from home</small></button><button class="choice" onclick="toast('Video added to the family story.')"><i>🎥</i><b>Video</b><small>Show them what they missed</small></button><button class="choice" onclick="toast('Voice message ready.')"><i>🎙️</i><b>Voice message</b><small>Say it in your own voice</small></button><button class="choice" onclick="toast('Note added to the story.')"><i>✍️</i><b>Write a note</b><small>A few words from home</small></button></div></div></div><div class="toast" id="toast"></div></div>
<script>
const I={dog:'https://images.unsplash.com/photo-1558788353-f76d92427f16?auto=format&fit=crop&w=900&q=85',pancakes:'https://images.unsplash.com/photo-1528207776546-365bb710ee93?auto=format&fit=crop&w=900&q=85',family:'https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=900&q=85',dinner:'https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&w=900&q=85'};
const P=[['Mom','https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=120&q=80'],['Dad','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=120&q=80'],['Maya','https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=120&q=80'],['Grandma','https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=120&q=80']];
function header(){return `<header><div class="logo">Meanwhile<b>♥</b></div><button class="icon" onclick="toast('3 new family moments')">♧</button></header>`}
function people(){return `<div class="people"><div class="person"><img class="avatar" src="${P[0][1]}"><b>All</b></div>${P.map(x=>`<div class="person"><img class="avatar" src="${x[1]}">${x[0]}</div>`).join('')}</div>`}
function home(){return header()+`<div class="hero"><div class="eyebrow">Good morning, Emma</div><h1>Here's what happened at home while you were away <span class="heart">♥</span></h1><p class="sub">A little piece of home, whenever you're ready.</p></div>${people()}<div class="recap"><div class="eyebrow">Your weekly story</div><h2>Meanwhile, at home...</h2><p>14 new memories, 3 family moments and one very spoiled dog.</p><button onclick="go('timeline')">See what you missed →</button></div><div class="section"><h2>New from home</h2><button class="link" onclick="go('timeline')">See all</button></div><div class="card"><img class="photo" src="${I.dog}"><div class="body"><div class="meta"><b>Mom</b><span>Today · 8:30 AM</span></div><div class="caption">Cooper says hi! Beautiful morning for a backyard fetch session.</div><div class="tiny"><span class="heart">♥</span> 12 family hearts</div></div></div><div class="card"><img class="photo" src="${I.pancakes}"><div class="body"><div class="meta"><b>Dad</b><span>Yesterday</span></div><div class="caption">Sunday pancakes are becoming a tradition.</div><div class="voice"><button class="play" onclick="toast('Playing Dad’s voice message…')">▶</button><div class="wave"></div><small>0:28</small></div></div></div>`}
function timeline(){return header()+`<div class="hero"><div class="eyebrow">Your family story</div><h1>Everything that happened while you were away.</h1><p class="sub">A living scrapbook of moments you missed — big and small.</p></div><div class="timeline"><div class="month">September · 2026</div><div class="tl"><div class="dot"></div><div class="tlbox"><img src="${I.dinner}"><b>Yesterday · Dad</b><p>Sunday dinner with Grandma. She asked when you're coming home.</p></div></div><div class="tl"><div class="dot"></div><div class="tlbox"><img src="${I.dog}"><b>Sept 6 · Mom</b><p>Cooper discovered the sprinkler. Absolute chaos.</p></div></div><div class="tl"><div class="dot"></div><div class="tlbox"><b>Sept 4 · Maya</b><p>Got her first day at the new job!</p></div></div><div class="month">August · 2026</div><div class="tl"><div class="dot"></div><div class="tlbox"><img src="${I.family}"><b>Aug 31 · Everyone</b><p>Last family dinner before you left for campus.</p></div></div></div>`}
function family(){return header()+`<div class="hero"><div class="eyebrow">Your people</div><h1>Your family, wherever they are.</h1><p class="sub">Invite the people who make home feel like home.</p></div>${P.map((x,i)=>`<div class="family"><img class="avatar" src="${x[1]}"><div class="grow"><b>${x[0]}</b><div class="tiny">${i===0?'Added 8 memories this week':i===1?'2 voice messages':'Added a memory recently'}</div></div>${i<2?'<span class="badge">Active</span>':''}</div>`).join('')}<div class="card" style="padding:18px;margin-top:18px"><h3>+ Invite someone</h3><p class="tiny">Grandparents, siblings, aunts and uncles can add to the story.</p><button class="pill" onclick="toast('Invite link copied — ready to share.')">Invite family</button></div>`}
function capsule(){return header()+`<div class="hero"><div class="eyebrow">Saved for later</div><h1>Some memories are worth waiting for.</h1><p class="sub">Create a message now. Let the right moment open it.</p></div><div class="capsule"><h3>Open when you need home</h3><p>7 memories from Mom, Dad and Grandma. A little reminder that everyone is thinking of you.</p><button onclick="toast('This capsule is sealed until the right moment.')">View capsule</button></div><div class="capsule"><h3>🎓 Emma's Graduation</h3><p>127 memories collected so far · 4 family members contributing.</p><button onclick="toast('Graduation capsule preview opened.')">Preview</button></div><div class="capsule"><h3>♥ First Semester</h3><p>12 memories waiting for December 18.</p><button onclick="toast('First Semester capsule preview opened.')">Preview</button></div>`}
function welcome(){return `<div class="welcome"><div><div class="wordmark">Meanwhile<b>♥</b></div><p class="sub">Life at home, while you're away.</p></div><div class="art">🎒</div><div><div class="eyebrow">For students leaving home</div><h1>Don't miss the moments that happen when you're away.</h1><p class="sub">Your family can quietly build a living story of home — photos, videos, voices and little things you would have missed.</p><button class="cta" onclick="go('home')">See what I missed</button><button class="secondary" onclick="toast('Visual prototype — no account needed.')">I'm a parent</button></div></div>`}
function go(x){location.hash=x;render(x)}function render(x){document.getElementById('app').innerHTML=x==='home'?home():x==='timeline'?timeline():x==='family'?family():x==='capsule'?capsule():welcome();let show=x!=='welcome';document.getElementById('nav').style.display=show?'flex':'none';document.getElementById('fab').style.display=show?'block':'none'}
function add(){document.getElementById('sheet').style.display='flex'}function closeSheet(){document.getElementById('sheet').style.display='none'}function toast(s){closeSheet();let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}render(location.hash.slice(1)||'welcome');
</script></body></html>
